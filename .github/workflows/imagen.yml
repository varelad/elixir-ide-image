name: Construir imagen

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la imagen (una por semestre; no reutilizar)"
        required: true
        default: "2026b"

permissions:
  contents: read
  packages: write

jobs:
  # Cada arquitectura se construye en un runner nativo: compilar Livebook y el
  # PLT de Dialyzer bajo emulación QEMU tardaría muchísimo más.
  construir:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # gratuito en repos públicos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io exige minúsculas en el nombre de la imagen
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/elixir-ide-image" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La CLI de dev containers mete la configuración de VS Code
      # (extensión y ajustes) dentro de la imagen como metadatos.
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGEN }}
          imageTag: ${{ inputs.etiqueta }}-${{ matrix.arch }}
          push: always
          runCmd: |
            uname -m
            elixir --version
            test -x /root/.mix/escripts/livebook
            ls -lh /root/.mix/dialyxir_*.plt

  # Une las dos imágenes bajo una sola etiqueta. Docker descarga
  # automáticamente la que corresponde a cada máquina.
  manifiesto:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/elixir-ide-image" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Crear la etiqueta multiarquitectura
        run: |
          docker buildx imagetools create \
            -t "$IMAGEN:${{ inputs.etiqueta }}" \
            "$IMAGEN:${{ inputs.etiqueta }}-amd64" \
            "$IMAGEN:${{ inputs.etiqueta }}-arm64"
          docker buildx imagetools inspect "$IMAGEN:${{ inputs.etiqueta }}"
